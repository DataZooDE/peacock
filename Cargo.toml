[workspace]
resolver = "3"
members = [
    "crates/peacock-types",
    "crates/peacock-theme",
    "crates/peacock-core",
    "crates/peacock-rasterizer",
    "crates/peacock-ggplot",
    "crates/peacock-server",
    "crates/peacock-bin",
    "crates/peacock-test-support",
    "crates/peacock-demo",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"
version = "0.1.0"
license = "BUSL-1.1"
authors = ["DataZoo GmbH <hello@data-zoo.de>"]
repository = "https://github.com/DataZooDE/peacock"
homepage = "https://github.com/DataZooDE/peacock"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.dependencies]
# Internal crates
peacock-types = { path = "crates/peacock-types" }
peacock-theme = { path = "crates/peacock-theme" }
peacock-core = { path = "crates/peacock-core" }
peacock-rasterizer = { path = "crates/peacock-rasterizer" }
peacock-ggplot = { path = "crates/peacock-ggplot" }
peacock-server = { path = "crates/peacock-server" }

# Shared third-party (versions aligned with escurel/triton workspaces)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML front-matter parsing for the authoring tooling (aligned with escurel's
# escurel-md, which parses skill markdown with the same crate).
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "time", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
async-trait = "0.1"
secrecy = "0.10"
tempfile = "3"
toml = "0.8"
# Pure-Rust SVG → PNG (no Node, no network, NFR-S-5). peacock renders its
# guardrail-restricted Vega-Lite subset to SVG itself, then rasterizes here.
resvg = "0.47"
usvg = "0.47"
tiny-skia = "0.12"
base64 = "0.22"
# The statistical backend (issue #6): pure-Rust Grammar of Graphics over
# plotters, headless in-memory PNG, bundled fonts. `default-features = false`
# drops the polars input adapter — peacock feeds it plain vectors. Only
# compiled behind peacock-core's `ggplot` feature.
ggplot-rs = { version = "0.9.2", default-features = false }

# Cross-repo path dependencies (see CLAUDE.md "Cross-repo dependencies").
# `query_instance` merged to escurel `main` (PR #205/#206), so these now
# point at the main escurel checkout (the feature worktree is gone).
escurel-client = { path = "../escurel/crates/escurel-client" }
escurel-types = { path = "../escurel/crates/escurel-types" }
escurel-test-support = { path = "../escurel/crates/escurel-test-support" }
triton-tests = { path = "../triton/crates/triton-tests" }

# Disk discipline, adopted from escurel (which reached 845 GB of `target/`
# before it was noticed). peacock's test binaries statically link libduckdb and
# the escurel gateway, and under the default `debug = 2` every one of them
# embeds a full copy of the dependency graph's DWARF. Measured here before this
# change: **15.3 GB of test binaries, 48 of them, averaging 490 MB** —
# `peacock-core` alone was 8.8 GB.
#
# CI already sets CARGO_PROFILE_DEV_DEBUG=0 / CARGO_PROFILE_TEST_DEBUG=0, so it
# never paid this; local development paid all of it.
#
# `line-tables-only` keeps the file:line mapping that makes a test-failure
# backtrace useful and drops the variable/type DWARF only an interactive
# debugger consumes. Dependencies get none at all — their symbol *names* are
# the symtab, not debuginfo, so backtraces through dep frames still read fine.
#
# Need a real debugger? `cargo test --profile dev-debug`, then
# `cargo clean --profile dev-debug` when you are done.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev-debug]
inherits = "dev"
debug = 2

[profile.dev-debug.package."*"]
debug = true

# peacock's no-mock tests spawn a real escurel gateway through
# `escurel-test-support` (52 call sites via `NorthwindEscurel`), and each spawn
# mints a 2048-bit RSA keypair for the harness's in-process OIDC issuer. Tests
# build with the `dev` profile, where dependencies are unoptimized by default,
# and unoptimized that keygen measures a mean of 4.88s (median 3.01s, max
# 9.73s) — it was the single largest line item in escurel's own suite.
#
# Profile settings only apply from the workspace root being built, so escurel
# having this fix does nothing for us; peacock needs its own copy.
#
# Only these two pure-computation crates are lifted, not the whole dependency
# graph: they sit well outside the code under test, so optimizing them costs a
# one-off compile and changes nothing a test can observe. Our own crates stay
# at opt-level 0 — debuggable backtraces and fast incremental rebuilds are
# worth more there.
#
# See escurel's docs/notes/discovered/2026-08-29-test-suite-cpu-rsa-keygen.md.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

name: CI

# The correctness gate: fmt + clippy + test + build on Linux, on every PR and
# every push to main / release tag — mirroring escurel's and triton's CI.
#
# peacock path-depends on its siblings **escurel** and **triton**, so CI checks
# them out next to peacock and builds the `triton` binary the consumer
# integration tests spawn. The Flutter-web client is built as a separate step.
# Cross-platform RELEASE binaries live in release.yml (v* tags only).
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short
  # The no-mock tests statically link libduckdb (via escurel-test-support) into
  # many test binaries; full debuginfo + parallel linking blows past the runner
  # memory budget. Drop test/dev debuginfo and serialise build jobs (escurel's
  # fix). CI-only; committed profiles and local dev builds are untouched.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # `CARGO_BUILD_JOBS` is NOT set job-wide. It was "1", then "4" when this
  # workflow moved to a 16 GB Blacksmith runner. peacock is a PUBLIC repo, so
  # GitHub-hosted minutes are free and Blacksmith was being paid for nothing —
  # these jobs are back on `ubuntu-latest`, which is 2 cores and 7 GB, where
  # parallel linking of the libduckdb-heavy test binaries exhausts memory.
  #
  # So the cap is back, but only on the steps that actually LINK (see below).
  # Job-wide was too broad: it also serialised `cargo clippy`, which runs no
  # linker and so paid the cap without ever having posed the risk. Same shape
  # escurel settled on.
  # The no-mock tests pull libduckdb transitively via escurel-test-support;
  # download the precompiled libduckdb (~2-3 min) instead of compiling from
  # source (~20-30 min), as escurel does. CI-only — local builds are untouched.
  DUCKDB_DOWNLOAD_LIB: "1"

jobs:
  ci:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # 2 cores with a serialised link; a cold cache needs real headroom.
    timeout-minutes: 90
    steps:
      - name: Checkout peacock
        uses: actions/checkout@v4
        with:
          path: peacock

      # escurel and triton are public, so the default GITHUB_TOKEN clones them
      # — no PAT/secret needed. (If either is ever made private, add a token
      # with read access to both here.)
      - name: Checkout escurel (path dep)
        uses: actions/checkout@v4
        with:
          repository: DataZooDE/escurel
          path: escurel

      - name: Checkout triton (path dep)
        uses: actions/checkout@v4
        with:
          repository: DataZooDE/triton
          path: triton

      # rust-toolchain.toml (in peacock/) pins the channel + components.
      - name: Install Rust toolchain
        working-directory: peacock
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy
          # Make peacock's pin the DEFAULT, not just this directory's override.
          #
          # `triton/` has no rust-toolchain.toml, so `cargo build` there resolves
          # to the runner image's default toolchain — and triton's crates declare
          # `rust-version = 1.95`. On the old `ubuntu-latest` image that default
          # happened to be new enough; it is not on every image, and the failure
          # is a wall of "triton-core@0.0.1 requires rustc 1.95" that names the
          # dependency rather than the toolchain, so it reads like a triton
          # problem. Pin it once here and every directory agrees.
          rustup default "$(rustup show active-toolchain | awk '{print $1}')"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: peacock
          # v2: the -dl caches are poisoned (they hold the libduckdb-sys
          # build-script fingerprint but NOT the downloaded .so — every main
          # run since 2026-07-01 link-fails, #11). Bump to start clean.
          shared-key: peacock-duckdb-dl-v2
          # The libduckdb-sys build script downloads libduckdb here and bakes
          # its path into the cached link-search output; cache it explicitly.
          cache-directories: peacock/target/duckdb-download
          cache-on-failure: true

      # Safety net for cache restores that lack the downloaded libduckdb: the
      # libduckdb-sys build script only re-downloads when it actually re-runs,
      # so force that by cleaning just that crate when the .so is absent.
      #
      # `cargo clean -p <pkg>` is per-PROFILE — bare, it cleans target/debug
      # only. This job builds dev/test artifacts, so bare is correct HERE. The
      # `build --release` job below needs `--release`, and the missing flag is
      # exactly why the earlier attempt at that split failed; see its comment.
      - name: Ensure libduckdb is present (cache-restore safety)
        working-directory: peacock
        run: |
          if ! ls target/duckdb-download/*/*/libduckdb.so >/dev/null 2>&1; then
            echo "libduckdb not in restored cache — forcing libduckdb-sys rebuild"
            cargo clean -p libduckdb-sys || true
          fi

      # The consumer integration tests spawn the real `triton` binary; the
      # harness walks up from triton/crates/triton-tests to target/debug/triton.
      #
      # Cached on the SHA actually checked out. The `Checkout triton` step above
      # pins no ref, so this tracks triton's default branch — recording the
      # resolved SHA is what makes the key honest rather than sticky.
      - name: Resolve the triton SHA
        id: triton_sha
        working-directory: triton
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the triton binary
        id: triton_bin
        uses: actions/cache@v4
        with:
          path: triton/target/debug/triton
          key: triton-bin-${{ runner.os }}-${{ steps.triton_sha.outputs.sha }}

      - name: Build triton binary
        if: steps.triton_bin.outputs.cache-hit != 'true'
        working-directory: triton
        run: cargo build --bin triton

      # A restored binary MUST be made newer than triton's sources.
      # `triton-tests` guards against a stale binary with an mtime pre-check and
      # rebuilds when it trips — shelling `cargo build -p triton-bin` from the
      # TEST's workspace, which is peacock, where no such package exists. It
      # then panics with "the `triton` binary looked stale and rebuilding it
      # failed", pointing nowhere near the cache. actions/cache restores original
      # mtimes while checkout stamps sources with the current time, so a restored
      # binary always looks stale. Observed exactly this way while measuring.
      - name: Freshen the restored triton binary (mtime > sources)
        if: steps.triton_bin.outputs.cache-hit == 'true'
        run: touch triton/target/debug/triton

      - name: cargo fmt --check
        working-directory: peacock
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: peacock
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `cargo test`, not nextest — and that is a measured decision, reversed
      # from the one this file used to carry.
      #
      # nextest schedules across test binaries where libtest runs them one at a
      # time, which is worth a lot on a many-core machine. But it runs each
      # test in its OWN process, and this suite's per-process cost is real (the
      # test issuer's RSA keypair, which no per-process memoisation can
      # amortise). That trades CPU for scheduling, and a 2-core runner has none
      # to spare. Pinned to two cores on this workspace, all 243 tests passing:
      #
      #   cargo test --workspace --all-targets   47.8s wall, 1m18s CPU
      #   cargo nextest run (test-threads = 2)   57.1s wall, 1m39s CPU
      #   cargo nextest run (test-threads = 8)   61.1s wall, 1m50s CPU
      #
      # Same result escurel measured independently. `.config/nextest.toml` is
      # kept for local use, where the cores make nextest the faster option.
      #
      # This step builds the test binaries, so it carries the link-memory cap.
      - name: cargo test
        working-directory: peacock
        run: cargo test --workspace --all-targets
        env:
          CARGO_BUILD_JOBS: "1"

      # `--all-targets` excludes doctests, so they get their own run rather
      # than being silently skipped.
      - name: cargo test --doc
        working-directory: peacock
        run: cargo test --workspace --doc


  # `cargo build --release` in its OWN job — second attempt.
  #
  # #28 split it out and #29 put it back, because the split job link-failed:
  #
  #   rust-lld: error: unable to find library -lduckdb
  #
  # #29 recorded honestly that "the guard step reported success and the link
  # still failed, so the guard is not sufficient and my model of why is wrong",
  # and asked for the duckdb behaviour to be understood before another attempt.
  # It is now, and the answer is one flag.
  #
  # `cargo clean -p <pkg>` cleans the DEV profile only; it needs `--release` to
  # touch target/release. Measured on escurel's workspace with both profiles
  # built:
  #
  #   cargo clean -p libduckdb-sys            -> 58 files, all target/debug
  #   cargo clean -p libduckdb-sys --release  -> 48 files, all target/release
  #
  # So the guard ran, reported success, and cleaned a profile this job does not
  # build. The stale release fingerprint survived, libduckdb-sys did not
  # re-run, it did not re-download, and the link had nothing to find. Nothing
  # about a "second cache scope" was special — the guard simply never applied.
  # Fixed and verified in escurel: DataZooDE/escurel#428, whose warm-cache run
  # shows the cache restored AND the guard firing, then linking clean.
  #
  # Verification protocol for this job, because the failure CANNOT appear on a
  # first run — a cold cache always links: run 1 seeds the cache, then a commit
  # touching no Cargo.toml/Cargo.lock/rust-toolchain.toml leaves the key intact
  # so run 2 restores it. Run 2 is the one that proves this. #29 was merged
  # while its CI was still running; that is the other half of what went wrong.
  build:
    name: build --release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout peacock
        uses: actions/checkout@v4
        with:
          path: peacock

      - name: Checkout escurel (path dep)
        uses: actions/checkout@v4
        with:
          repository: DataZooDE/escurel
          path: escurel

      - name: Checkout triton (path dep)
        uses: actions/checkout@v4
        with:
          repository: DataZooDE/triton
          path: triton

      - name: Install Rust toolchain
        working-directory: peacock
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup default "$(rustup show active-toolchain | awk '{print $1}')"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: peacock
          # Its own key: this job's target/ holds release artifacts, the `ci`
          # job's holds dev+test ones. Sharing a key would have them overwrite
          # each other.
          shared-key: peacock-release-build
          cache-directories: peacock/target/duckdb-download
          cache-on-failure: true

      # THE fix. `--release`, because this job builds the release profile.
      - name: Ensure libduckdb is present (cache-restore safety)
        working-directory: peacock
        run: |
          if ! ls target/duckdb-download/*/*/libduckdb.so >/dev/null 2>&1; then
            echo "libduckdb not in restored cache — forcing libduckdb-sys rebuild"
            cargo clean -p libduckdb-sys --release || true
          fi

      # No triton BINARY here: only the tests spawn it, and they live in the
      # `ci` job. This job needs triton checked out for the path dep to
      # resolve, nothing more.
      - name: cargo build --release
        working-directory: peacock
        run: cargo build --workspace --release
        env:
          # This job links every binary in the workspace; on a 2-core / 7 GB
          # runner that needs the same cap as the test build.
          CARGO_BUILD_JOBS: "1"

  flutter:
    name: flutter-web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The release `dart2js` compile of a Flutter web app peaks above this
      # runner's 7 GB and gets OOM-killed early — an abnormal exit with no
      # diagnostic, which reads like a toolchain bug rather than memory. The
      # same build is fine on a 16 GB box, which is why this was not needed
      # while the job ran on Blacksmith. Add swap so dart2js can spill.
      #
      # triton hit exactly this and carries the same step; see its ci.yml.
      - name: Add swap space
        run: |
          # The runner ships a small /swapfile — replace it with a bigger one.
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 14G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build the peacock-web bundle
        working-directory: web/peacock-web
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --base-href /app/

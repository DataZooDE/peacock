# cargo-nextest configuration.
#
# nextest is a LOCAL convenience here, not the merge gate. CI runs plain
# `cargo test --workspace --all-targets`, and that is a measured decision —
# see the comment on the `cargo test` step in .github/workflows/ci.yml.
#
# The short version: nextest schedules across test binaries where libtest runs
# them one at a time, which is worth having on a many-core machine. But it runs
# each test in its OWN process, and this suite pays a real per-process cost
# (the test issuer's RSA keypair). That trades CPU for scheduling, and CI runs
# on a 2-core `ubuntu-latest` box — free, because peacock is public — which has
# none to spare. Pinned to two cores, all 243 tests passing:
#
#   cargo test --workspace --all-targets   47.8s wall, 1m18s CPU
#   cargo nextest run (test-threads = 2)   57.1s wall, 1m39s CPU
#   cargo nextest run (test-threads = 8)   61.1s wall, 1m50s CPU
#
# escurel measured the same ordering independently on its own suite.

[profile.default]
test-threads = 8

slow-timeout = { period = "45s", terminate-after = 8 }

[profile.ci]
inherits = "default"
fail-fast = false
retries = 1
final-status-level = "flaky"